apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jurisai-ingress
  namespace: jurisai
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/limit-rps: "1000"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://jurisai.io,https://app.jurisai.io"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - jurisai.io
    - api.jurisai.io
    - ws.jurisai.io
    secretName: jurisai-tls
  rules:
  - host: jurisai.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jurisai-web
            port:
              number: 3000
  - host: api.jurisai.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jurisai-web
            port:
              number: 3000
  - host: ws.jurisai.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jurisai-ws
            port:
              number: 3001
