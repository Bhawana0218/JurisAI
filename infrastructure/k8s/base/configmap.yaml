apiVersion: v1
kind: ConfigMap
metadata:
  name: jurisai-config
  namespace: jurisai
data:
  NODE_ENV: "production"
  NEXT_PUBLIC_APP_URL: "https://jurisai.io"
  NEXT_PUBLIC_API_URL: "https://api.jurisai.io"
  WS_PORT: "3001"
  LOGGING_ENDPOINT: "http://logs.jurisai.svc.cluster.local:8080"
  METRICS_ENDPOINT: "http://metrics.jurisai.svc.cluster.local:9090"
  TRACING_ENDPOINT: "http://tracing.jurisai.svc.cluster.local:4318"
  DATABASE_URL: "postgresql://jurisai:$(POSTGRES_PASSWORD)@postgres:5432/jurisai"
  REDIS_URL: "redis://redis:6379"
  KAFKA_BROKERS: "kafka:9092"
  TEMPORAL_HOST: "temporal:7233"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jurisai-runtime-config
  namespace: jurisai
data:
  RATE_LIMIT_CHAT: "30"
  RATE_LIMIT_API: "60"
  RATE_LIMIT_UPLOAD: "10"
  MAX_FILE_SIZE: "10485760"
  DEFAULT_MODEL: "gpt-4.1-mini"
  EMBEDDING_MODEL: "text-embedding-3-small"
  VECTOR_DIMENSIONS: "1536"
  CACHE_TTL: "300"
  WORKFLOW_TIMEOUT: "300000"
  MAX_CONCURRENT_AGENTS: "10"
  LOG_LEVEL: "info"
