name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=juris-ai/prisma/schema.prisma

      - name: TypeScript check
        run: npx tsc --noEmit -p juris-ai/tsconfig.json

      - name: Lint
        run: npm run lint --workspace=juris-ai

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jurisai
          POSTGRES_PASSWORD: jurisai_test
          POSTGRES_DB: jurisai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U jurisai
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=juris-ai/prisma/schema.prisma

      - name: Run migrations
        run: npx prisma migrate deploy --schema=juris-ai/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://jurisai:jurisai_test@localhost:5432/jurisai_test

      - name: Run tests
        run: npm test --workspace=juris-ai
        env:
          DATABASE_URL: postgresql://jurisai:jurisai_test@localhost:5432/jurisai_test
          NEXTAUTH_SECRET: test-secret
          NEXTAUTH_URL: http://localhost:3000

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=juris-ai/prisma/schema.prisma

      - name: Build web
        run: npm run build:web

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: jurisai-build
          path: juris-ai/.next/
          retention-days: 1

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run npm audit
        run: npm audit || true

      - name: Run SAST
        uses: github/codeql-action/analyze@v3
        with:
          languages: typescript
